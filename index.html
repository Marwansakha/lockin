<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080c" id="tc">
<title>Happiness Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#08080c;--bg2:#0c0e14;--card:rgba(255,255,255,0.015);--card-done-bg:linear-gradient(135deg,rgba(167,139,250,0.05),rgba(167,139,250,0.02));--border:rgba(255,255,255,0.04);--border2:rgba(255,255,255,0.06);--text:#e2e2e8;--dim:#ccc;--muted:#888;--faint:#555;--ghost:#444;--hidden:#333;--chk-border:rgba(255,255,255,0.1);--tab-bg:rgba(8,8,12,0.95);--tab-border:rgba(255,255,255,0.05);--modal-bg:#14161c;--input-bg:rgba(255,255,255,0.06);--input-border:rgba(255,255,255,0.1);--overlay:rgba(0,0,0,0.7);--btn-bg:rgba(255,255,255,0.03);--prog-bg:rgba(255,255,255,0.04);--select-bg:#14161c;--img-shadow:none}
:root.light{--bg:#f5f5f7;--bg2:#eeeef0;--card:rgba(0,0,0,0.025);--card-done-bg:linear-gradient(135deg,rgba(167,139,250,0.1),rgba(167,139,250,0.04));--border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.1);--text:#1a1a1a;--dim:#333;--muted:#666;--faint:#888;--ghost:#aaa;--hidden:#ccc;--chk-border:rgba(0,0,0,0.15);--tab-bg:rgba(245,245,247,0.95);--tab-border:rgba(0,0,0,0.08);--modal-bg:#fff;--input-bg:rgba(0,0,0,0.04);--input-border:rgba(0,0,0,0.12);--overlay:rgba(0,0,0,0.4);--btn-bg:rgba(0,0,0,0.04);--prog-bg:rgba(0,0,0,0.06);--select-bg:#fff;--img-shadow:0 2px 8px rgba(0,0,0,0.1)}
body{background:var(--bg);color:var(--text);font-family:'SF Pro Display','Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;min-height:100dvh;transition:background 0.3s,color 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes emojiBounce{0%{transform:scale(0.6)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes fadeInOut{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0;pointer-events:none}}
button{font-family:inherit;cursor:pointer}
.tab-bar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--tab-bg);backdrop-filter:blur(20px);border-top:1px solid var(--tab-border);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;padding:10px 0 8px;background:none;border:none;color:var(--ghost);font-size:10px;font-weight:700;letter-spacing:0.3px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 0.2s}
.tab-btn.active{color:#a78bfa}
.tab-btn .ti{font-size:19px}
.page{padding:0 16px 100px;display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:8px;transition:all 0.3s}
.card.done{border-color:rgba(167,139,250,0.2);background:var(--card-done-bg)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--chk-border);background:transparent;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.chk.on{border:none;background:#a78bfa;box-shadow:0 0 14px rgba(167,139,250,0.2)}
.modal-overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--modal-bg);border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal input,.modal select{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;outline:none;font-family:inherit;margin-bottom:10px;-webkit-appearance:none}
.modal input:focus,.modal select:focus{border-color:#a78bfa}
.modal select option{background:var(--select-bg);color:var(--text)}
.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;margin-right:4px}
.sec-label{font-size:10px;font-weight:800;letter-spacing:3px;color:var(--faint);text-transform:uppercase;padding:12px 4px 8px}
.prog-bar{height:4px;border-radius:2px;background:var(--prog-bg);overflow:hidden;margin-top:4px}
.prog-fill{height:100%;border-radius:2px;transition:width 0.4s}
.period-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--btn-bg);color:var(--muted);font-size:11px;font-weight:700;transition:all 0.2s}
.period-btn.active{background:rgba(167,139,250,0.1);border-color:rgba(167,139,250,0.3);color:#a78bfa}
@keyframes dFadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes dLine{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes dScale{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}
.dscreen{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:var(--bg)}
.dpill{width:100%;max-width:340px;padding:22px;border-radius:100px;font-size:19px;font-weight:800;letter-spacing:3px;border:1.5px solid;background:transparent;transition:all 0.25s;margin-bottom:14px}
.dpill.build{color:#3b82f6;border-color:rgba(59,130,246,0.35)}
.dpill.build:active{background:rgba(59,130,246,0.12);box-shadow:0 0 30px rgba(59,130,246,0.2)}
.dpill.drift{color:#b91c1c;border-color:rgba(185,28,28,0.3)}
.dpill.drift:active{background:rgba(185,28,28,0.1)}
.dmeta{font-size:10px;font-weight:700;letter-spacing:4px;color:var(--ghost);text-transform:uppercase}
.dline{font-size:17px;font-weight:600;color:var(--muted);margin:5px 0;animation:dLine 0.5s ease both}
.hold-btn{position:fixed;bottom:78px;right:16px;z-index:45;background:linear-gradient(135deg,#b45309,#92400e);border:none;color:#fff;border-radius:100px;padding:13px 20px;font-size:13px;font-weight:800;letter-spacing:1.5px;box-shadow:0 4px 20px rgba(180,83,9,0.35)}
.sheet{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end}
.sheet-in{background:var(--modal-bg);border-radius:24px 24px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:22px 20px 36px;animation:dFadeIn 0.25s ease}
.urow{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 16px;margin-bottom:7px;text-align:left;font-size:15px;font-weight:600;color:var(--dim)}
.statpill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:100px;border:1px solid var(--border);background:var(--card)}
@keyframes cineIn{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
@keyframes cineOut{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-14px)}}
@keyframes cineOutBack{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(14px)}}
.cine-nav{position:absolute;top:0;bottom:0;width:32%;background:none;border:none;z-index:5}
.cine-arrow{position:absolute;bottom:38px;background:var(--btn-bg);border:1px solid var(--border);color:var(--muted);border-radius:50%;width:38px;height:38px;font-size:15px;z-index:8;display:flex;align-items:center;justify-content:center}
.cine-dot{width:5px;height:5px;border-radius:50%;background:var(--border2);transition:all 0.5s;border:none;padding:0}
.cine-dot.on{background:#3b82f6;width:16px;border-radius:100px}
.cine-dots{position:absolute;bottom:46px;left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:9}
/* Alignment animations */
@keyframes pctPop{0%{transform:scale(1)}35%{transform:scale(1.11)}100%{transform:scale(1)}}
@keyframes ripple{0%{transform:scale(0.6);opacity:0.5}100%{transform:scale(2.4);opacity:0}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes sparkUp{0%{opacity:0;transform:translateY(0) scale(0.4)}25%{opacity:1}100%{opacity:0;transform:translateY(-42px) scale(1)}}
@keyframes barGlow{0%,100%{box-shadow:0 0 8px currentColor}50%{box-shadow:0 0 20px currentColor}}
.pct-num{display:inline-block;font-variant-numeric:tabular-nums;transition:color 0.5s}
.pct-num.pop{animation:pctPop 0.55s cubic-bezier(.3,1.4,.5,1)}
.pct-wrap{position:relative;display:inline-block}
.pct-ripple{position:absolute;left:50%;top:52%;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:2px solid currentColor;animation:ripple 0.9s ease-out forwards;pointer-events:none}
.spark{position:absolute;font-size:13px;animation:sparkUp 1.15s ease-out forwards;pointer-events:none}
.bar-shell{position:relative;overflow:hidden;border-radius:100px}
.bar-shine{position:absolute;top:0;bottom:0;width:34%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);animation:shimmer 1.5s ease-out}
.milestone{font-size:11px;font-weight:700;letter-spacing:1px;animation:cineIn 0.6s ease both}
/* Meditation */
@keyframes alarmPulse{0%,100%{opacity:0.75}50%{opacity:1}}
@keyframes breathe{0%,100%{transform:scale(0.82);opacity:0.5}50%{transform:scale(1.12);opacity:0.95}}
@keyframes breatheSlow{0%,100%{transform:scale(0.9);opacity:0.28}50%{transform:scale(1.2);opacity:0.6}}
@keyframes haloSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes floatUp{0%{transform:translateY(0)}50%{transform:translateY(-7px)}100%{transform:translateY(0)}}
.med-orb{position:relative;width:210px;height:210px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.med-ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(129,140,248,0.32),transparent 68%)}
.med-ring2{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,0.26),transparent 66%)}
.med-figure{font-size:66px;position:relative;z-index:2;animation:floatUp 5.5s ease-in-out infinite}
.med-halo{position:absolute;inset:-14px;border-radius:50%;border:1px dashed rgba(129,140,248,0.22);animation:haloSpin 34s linear infinite}
@keyframes cineDrift{0%{transform:scale(1)}100%{transform:scale(1.06)}}
@keyframes softFadeUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
.cine-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 26px;opacity:0}
.cine-frame{width:100%;max-width:330px;border-radius:20px;overflow:hidden;background:var(--card);box-shadow:0 18px 50px rgba(0,0,0,0.4),0 0 0 1px var(--border)}
.cine-frame img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;animation:cineDrift 9s ease-out both}
.cine-grid{width:100%;max-width:330px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cine-cell{border-radius:16px;overflow:hidden;background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,0.32),0 0 0 1px var(--border)}
.cine-cell img{width:100%;aspect-ratio:1;object-fit:cover;display:block;animation:cineDrift 11s ease-out both}
.cine-head{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.3px;line-height:1.35;margin-top:30px;text-align:center;max-width:340px}
.cine-body{font-size:14.5px;font-weight:500;color:var(--muted);line-height:1.72;margin-top:14px;text-align:center;max-width:330px}

</style>
</head>
<body>
<div id="app"></div>
<script>
const SK="happiness-v5";
const START="2026-08-23";
const TDAYS=365;
const SEASON_LEN=90;
const SEASON_NAMES=["LOCK IN 01","LOCK IN 02","LOCK IN 03","LOCK IN 04"];
const URGE_TYPES=[
  {id:"nicotine",emoji:"\u{1F6AC}",label:"Nicotine"},
  {id:"food",emoji:"\u{1F354}",label:"Food"},
  {id:"drink",emoji:"\u{1F37A}",label:"Going out / drinking"},
  {id:"sexual",emoji:"\u{2764}\u{FE0F}\u{200D}\u{1F525}",label:"Sexual impulse"},
  {id:"spending",emoji:"\u{1F4B8}",label:"Spending"},
  {id:"procrastination",emoji:"\u{1F4F1}",label:"Procrastination"},
  {id:"stress",emoji:"\u{1F624}",label:"Stress escape"},
  {id:"other",emoji:"\u{2022}\u{2022}\u{2022}",label:"Other"},
];
const CINE_SLIDES=[
  {h:"Enjoy today.",b:"The future I want is built one day at a time, but I still have to live the day I\u2019m in. I don\u2019t need to postpone happiness until everything is perfect."},
  {h:"Stress will come. That\u2019s normal.",b:"There will be problems, uncertainty, uncomfortable conversations and things I cannot control. They are part of life \u2014 not a reason to abandon the direction I chose this morning."},
  {h:"Most of today\u2019s problems will not matter in five years.",b:"Deal with what actually needs to be dealt with, then move on. Don\u2019t allow one email, one problem, one person or one stressful moment to take over the entire day."},
  {h:"Don\u2019t trade the future for temporary relief.",b:"The cigarette, impulse, distraction or easy option may feel good for a few minutes. The life in these photos is worth tolerating some discomfort for."},
  {h:"Keep the long-term vision in sight.",b:"I don\u2019t need to build my entire life today. I only need to make today\u2019s decisions in the direction of the man and the life I want to become."},
];
const PAUSE_SLIDES=[
  {h:"Remember what you\u2019re protecting.",b:"This decision is small. The direction it reinforces isn\u2019t."},
  {h:"Temporary relief is expensive when you keep buying it with your future.",b:"You don\u2019t have to feel strong right now. You only have to avoid acting on the impulse."},
  {h:"Keep the bigger life in sight.",b:"The stress, craving, or discomfort you\u2019re feeling right now will pass. Don\u2019t let a temporary feeling make a decision for the person you want to be five years from now."},
];
const SEASON_GOALS=[
  "\u{1F6AD} Stay nicotine-free",
  "\u{1F3CB}\u{FE0F} Get leaner",
  "\u{1F4BC} Take control of Stella",
  "\u{1F916} Launch AI Bootcamp",
  "\u{1F4B0} Stop increasing debt",
  "\u{1F3AC} Build content consistently",
  "\u{1F48D} Increase marriage opportunities",
];
function getDateFromSeasonDay(seasonNum,seasonDay){
  return d2s((seasonNum-1)*SEASON_LEN+seasonDay);
}
function seasonInfo(dayNum){
  const num=Math.max(1,Math.ceil(dayNum/SEASON_LEN));
  const day=dayNum-(num-1)*SEASON_LEN;
  const startD=new Date(START+"T00:00:00");startD.setDate(startD.getDate()+(num-1)*SEASON_LEN);
  const endD=new Date(startD);endD.setDate(endD.getDate()+SEASON_LEN-1);
  return{num,day,name:SEASON_NAMES[num-1]||("LOCK IN "+String(num).padStart(2,"0")),start:fmt(startD),end:fmt(endD)};
}

// Theme: auto (6am-7pm light), light, dark
function applyTheme(){
  const d=S?.data;
  const pref=d?.theme||"auto";
  let isLight;
  if(pref==="light")isLight=true;
  else if(pref==="dark")isLight=false;
  else{const h=new Date().getHours();isLight=h>=6&&h<19}
  document.documentElement.classList.toggle("light",isLight);
  document.getElementById("tc")?.setAttribute("content",isLight?"#f5f5f7":"#08080c");
}

const MOODS=[
  {min:0,emoji:"\u{1FAE5}",label:"New day",color:"#64748b"},
  {min:15,emoji:"\u{1F642}",label:"Getting started",color:"#94a3b8"},
  {min:35,emoji:"\u{1F60C}",label:"In the zone",color:"#eab308"},
  {min:55,emoji:"\u{1F60F}",label:"On track",color:"#f59e0b"},
  {min:75,emoji:"\u{1F60A}",label:"Happy",color:"#10b981"},
  {min:90,emoji:"\u{1F604}",label:"Amazing",color:"#a78bfa"},
  {min:100,emoji:"\u{1F9D8}",label:"At peace",color:"#818cf8"},
];
const CHILL={emoji:"\u{1F9D8}",label:"Full day \u{1F451}",color:"#818cf8"};
function getMood(p){let m=MOODS[0];for(const x of MOODS)if(p>=x.min)m=x;return m}

const EMOJIS=["💪","❤️","💍","💰","🧘","🎯","⭐","🧠","🏆","🌟","🔑","👑","🎨","📚","🏠","🤝"];
const HABIT_EMOJIS=["🏋️","🧊","🥗","🚭","🥬","💍","💼","🎬","🚀","🧘","📖","💧","🚶","🎵","📝","⭐"];

const DEF_GOALS=[
  {id:"g1",name:"Have a great body",emoji:"💪"},
  {id:"g2",name:"Be healthy",emoji:"❤️"},
  {id:"g3",name:"Find a wife",emoji:"💍"},
  {id:"g4",name:"Make money",emoji:"💰"},
  {id:"g5",name:"Mental peace",emoji:"🧘"},
];
const DEF_HABITS=[
  {id:"h1",label:"Get my workout in",emoji:"🏋️",goalIds:["g1"],perWeek:5,linkedHabitId:null},
  {id:"h2",label:"Recovery",emoji:"🧊",goalIds:["g1"],perWeek:2,linkedHabitId:"h1"},
  {id:"h3",label:"Macros & calories on target",emoji:"🥗",goalIds:["g1"],perWeek:7,linkedHabitId:null},
  {id:"h4",label:"Did not smoke",emoji:"🚭",goalIds:["g2"],perWeek:7,linkedHabitId:null},
  {id:"h5",label:"Eat clean",emoji:"🥬",goalIds:["g2"],perWeek:7,linkedHabitId:null},
  {id:"h6",label:"Put in work to find the wife",emoji:"💍",goalIds:["g3"],perWeek:7,linkedHabitId:null},
  {id:"h7",label:"Stella work",emoji:"💼",goalIds:["g4"],perWeek:4,linkedHabitId:null},
  {id:"h8",label:"Content work",emoji:"🎬",goalIds:["g4"],perWeek:4,linkedHabitId:null},
  {id:"h9",label:"New project work",emoji:"🚀",goalIds:["g4"],perWeek:4,linkedHabitId:null},
  {id:"h10",label:"Meditate 5 min",emoji:"🧘",goalIds:["g5"],perWeek:7,linkedHabitId:null},
  {id:"h11",label:"Read mantras",emoji:"📿",goalIds:["g5"],perWeek:7,linkedHabitId:null},
  {id:"h12",label:"Reading / learning",emoji:"📖",goalIds:["g3","g4","g5"],perWeek:5,linkedHabitId:null},
];
const DEF_MANTRAS=[
  {id:"m1",text:"I am in control of my day"},
  {id:"m2",text:"Discipline is freedom"},
  {id:"m3",text:"I build the life I want brick by brick"},
];

// Utils
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return fmt(new Date())}
function dn(ds){return Math.floor((new Date(ds+"T00:00:00")-new Date(START+"T00:00:00"))/86400000)+1}
function d2s(n){const d=new Date(START+"T00:00:00");d.setDate(d.getDate()+n-1);return fmt(d)}
function fmtD(s){return new Date(s+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
function fmtShort(s){return new Date(s+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}

// Week helpers: Monday-based weeks
function getWeekStart(ds){const d=new Date(ds+"T00:00:00");const day=d.getDay();const diff=day===0?6:day-1;d.setDate(d.getDate()-diff);return fmt(d)}
function getWeekDates(ds){const ws=getWeekStart(ds);const dates=[];for(let i=0;i<7;i++){const d=new Date(ws+"T00:00:00");d.setDate(d.getDate()+i);dates.push(fmt(d))}return dates}
function getMonthDates(ds){const d=new Date(ds+"T00:00:00");const y=d.getFullYear(),m=d.getMonth();const dates=[];const first=new Date(y,m,1);const last=new Date(y,m+1,0);for(let i=first.getDate();i<=last.getDate();i++){dates.push(fmt(new Date(y,m,i)))}return dates}
function getQuarterDates(ds){const d=new Date(ds+"T00:00:00");const m=d.getMonth();const qStart=m-m%3;const dates=[];for(let mo=qStart;mo<qStart+3;mo++){const y=d.getFullYear();const last=new Date(y,mo+1,0).getDate();for(let i=1;i<=last;i++)dates.push(fmt(new Date(y,mo,i)))}return dates}

// Data
function load(){try{const r=localStorage.getItem(SK);if(r){const d=JSON.parse(r);if(!d.mantras)d.mantras=DEF_MANTRAS.map(m=>({...m}));if(!d.trophies)d.trophies=[];if(!d.theme)d.theme="auto";if(!d.nicotineStart)d.nicotineStart=null;d.habits.forEach(h=>{if(h.goalId&&!h.goalIds){h.goalIds=[h.goalId];delete h.goalId}if(!h.goalIds)h.goalIds=[]});if(!d.habits.find(h=>h.id==="h12"))d.habits.push({id:"h12",label:"Reading / learning",emoji:"\u{1F4D6}",goalIds:["g3","g4","g5"],perWeek:5,linkedHabitId:null});return d}}catch(e){}return{goals:DEF_GOALS.map(g=>({...g})),habits:DEF_HABITS.map(h=>({...h})),mantras:DEF_MANTRAS.map(m=>({...m})),trophies:[],days:{},theme:"auto",nicotineStart:null,v:6}}

  const fam=shuffle(all.filter(t=>t.family));

  // Final slide first: 4 family photos (top up with others only if short)

// ===== ALARM ENGINE =====
// Layered on purpose: mobile browsers each break a different one of these.
let AUDIO=null, SCHEDULED=[], BELL=null, KEEPALIVE=null, ALARM_TO=null, ALARM_AT=null, AUDIO_READY=false;

// --- build a real bell WAV at runtime (no external file) ---
function buildWav(seconds,fn,rate){
  rate=rate||11025;
  const n=Math.floor(rate*seconds), buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const wr=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  wr(0,"RIFF");v.setUint32(4,36+n*2,true);wr(8,"WAVE");wr(12,"fmt ");
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);
  v.setUint16(34,16,true);wr(36,"data");v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){
    let s=fn(i/rate);
    s=Math.max(-1,Math.min(1,s));
    v.setInt16(44+i*2,s*32767,true);
  }
  let bin="";const b=new Uint8Array(buf);
  for(let i=0;i<b.length;i++)bin+=String.fromCharCode(b[i]);
  return "data:audio/wav;base64,"+btoa(bin);
}
function bellSrc(){
  // three strikes, 2s apart, each a decaying harmonic bell
  return buildWav(7.2,t=>{
    let s=0;
    [0,2.2,4.4].forEach(st=>{
      const d=t-st;
      if(d<0||d>2.6)return;
      const env=Math.exp(-d*1.7);
      s+=env*(Math.sin(2*Math.PI*528*d)*0.5+Math.sin(2*Math.PI*792*d)*0.25+Math.sin(2*Math.PI*1056*d)*0.14);
    });
    return s*0.85;
  });
}
function silentSrc(){
  // near-silent hum: keeps the audio session alive so timers don't get frozen
  return buildWav(1.0,t=>Math.sin(2*Math.PI*60*t)*0.0016,8000);
}

// Must be called from inside a real tap.
function unlockAudio(){
  try{
    if(!BELL){BELL=new Audio(bellSrc());BELL.preload="auto";BELL.volume=1}
    if(!KEEPALIVE){KEEPALIVE=new Audio(silentSrc());KEEPALIVE.loop=true;KEEPALIVE.volume=0.02}
    // prime the bell so a later .play() needs no gesture
    const p=BELL.play();
    if(p&&p.then)p.then(()=>{BELL.pause();BELL.currentTime=0;AUDIO_READY=true}).catch(()=>{});
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){if(!AUDIO)AUDIO=new AC();if(AUDIO.state==="suspended")AUDIO.resume();
      const o=AUDIO.createOscillator(),g=AUDIO.createGain();
      g.gain.value=0.0001;o.connect(g);g.connect(AUDIO.destination);
      o.start();o.stop(AUDIO.currentTime+0.03);}
    if("Notification" in window && Notification.permission==="default")Notification.requestPermission().catch(()=>{});
    return AUDIO;
  }catch(e){return null}
}
function startKeepAlive(){try{if(KEEPALIVE&&KEEPALIVE.paused)KEEPALIVE.play().catch(()=>{})}catch(e){}}
function stopKeepAlive(){try{if(KEEPALIVE)KEEPALIVE.pause()}catch(e){}}

function ringNow(label){
  // 1. WAV element — survives backgrounding best
  try{if(BELL){BELL.currentTime=0;BELL.volume=1;const p=BELL.play();if(p&&p.catch)p.catch(()=>{})}}catch(e){}
  // 2. Web Audio backup
  try{
    if(AUDIO){if(AUDIO.state==="suspended")AUDIO.resume();
      [528,792,1056].forEach((f,i)=>{for(let r=0;r<3;r++){
        const o=AUDIO.createOscillator(),g=AUDIO.createGain();
        o.type="sine";o.frequency.value=f;
        const t=AUDIO.currentTime+r*2.2+i*0.02;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.25/(i+1),t+0.04);
        g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
        o.connect(g);g.connect(AUDIO.destination);o.start(t);o.stop(t+2.6);
      }});}
  }catch(e){}
  // 3. Vibration
  buzz([500,200,500,200,700]);
  // 4. System notification (works when the app isn't in front)
  try{
    if("Notification" in window && Notification.permission==="granted"){
      const n=new Notification(label||"Time\u2019s up",{body:"Tap to return.",silent:false});
      setTimeout(()=>{try{n.close()}catch(e){}},20000);
    }
  }catch(e){}
  // 5. Visual, in case sound is muted
  flashAlarm(label);
}
function flashAlarm(label){
  const ov=document.createElement("div");
  ov.id="alarmflash";
  ov.style.cssText="position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:rgba(129,140,248,0.16);backdrop-filter:blur(2px);animation:alarmPulse 1s ease-in-out infinite";
  ov.innerHTML='<div style="text-align:center"><div style="font-size:62px">\u{1F514}</div><div style="font-size:20px;font-weight:800;color:#818cf8;margin-top:8px">'+(label||"Time\u2019s up")+'</div></div>';
  ov.onclick=()=>ov.remove();
  document.body.appendChild(ov);
  setTimeout(()=>{const e=document.getElementById("alarmflash");if(e)e.remove()},9000);
}

// Fire in `secs`. Uses three independent triggers so throttling can't kill it.
function scheduleChime(secs,label){
  cancelChime();
  unlockAudio();startKeepAlive();
  ALARM_AT=Date.now()+secs*1000;
  ALARM_TO=setTimeout(()=>{if(ALARM_AT){ALARM_AT=null;ringNow(label)}},secs*1000);
  // audio-clock backup (immune to JS timer throttling)
  try{
    if(AUDIO){
      [528,792,1056].forEach((f,i)=>{for(let r=0;r<3;r++){
        const o=AUDIO.createOscillator(),g=AUDIO.createGain();
        o.type="sine";o.frequency.value=f;
        const t=AUDIO.currentTime+secs+r*2.2+i*0.02;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.22/(i+1),t+0.04);
        g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
        o.connect(g);g.connect(AUDIO.destination);o.start(t);o.stop(t+2.6);
        SCHEDULED.push(o);
      }});
    }
  }catch(e){}
}
function cancelChime(){
  if(ALARM_TO){clearTimeout(ALARM_TO);ALARM_TO=null}
  ALARM_AT=null;
  SCHEDULED.forEach(o=>{try{o.stop()}catch(e){}});
  SCHEDULED=[];
  try{if(BELL){BELL.pause();BELL.currentTime=0}}catch(e){}
  stopKeepAlive();
}
function chimeNow(){unlockAudio();setTimeout(()=>ringNow("Test"),60)}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p||[400,150,400,150,600])}catch(e){}}

function tapMantra(mid){
  const d=S.data,ds=S.sel;
  if(!d.days[ds])d.days[ds]={checks:{},chilled:false};
  if(!d.days[ds].mc)d.days[ds].mc={};
  const cur=d.days[ds].mc[mid]||0;
  if(cur>=2)return;
  // Check if morning was already done before this tap
  const wasR1=d.mantras.every(m=>(d.days[ds].mc[m.id]||0)>=1);
  d.days[ds].mc[mid]=cur+1;
  const allR1=d.mantras.every(m=>(d.days[ds].mc[m.id]||0)>=1);
  const allR2=d.mantras.every(m=>(d.days[ds].mc[m.id]||0)>=2);
  if(allR2){
    const mHabit=d.habits.find(h=>h.label.toLowerCase().includes("mantra"));
    if(mHabit)d.days[ds].checks[mHabit.id]=true;
    setTimeout(()=>{

// Trophies
function addTrophyPhoto(){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.multiple=true;
  inp.onchange=e=>{
    const files=Array.from(e.target.files);if(!files.length)return;
    let processed=0;const results=[];
    files.forEach((f,i)=>{
      const reader=new FileReader();
      reader.onload=ev=>{
        const img=new Image();
        img.onload=()=>{
          const canvas=document.createElement("canvas");
          const maxW=600,maxH=600;
          let w=img.width,h=img.height;
          if(w>maxW){h*=maxW/w;w=maxW}
          if(h>maxH){w*=maxH/h;h=maxH}
          canvas.width=w;canvas.height=h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          results[i]=canvas.toDataURL("image/jpeg",0.7);
          processed++;
          if(processed===files.length){
            if(results.length===1){
              set({modal:"trophyCaption",mf:{image:results[0]}});
            } else {
              results.forEach(img=>{
                S.data.trophies.unshift({id:"t"+Date.now()+Math.random(),image:img,caption:"",date:today()});
              });
              save(S.data);render();
            }
          }
        };
        img.src=ev.target.result;
      };
      reader.readAsDataURL(f);
    });
  };
  inp.click();
}

// Stats
function weekCount(data,hid,ds){
  const dates=getWeekDates(ds);let c=0;
  for(const d of dates){if(data.days[d]?.checks?.[hid])c++}
  return c;
}
function getDayPct(data,ds){
  const day=data.days[ds];
  if(day?.chilled)return 100;
  const habs=data.habits;if(!habs.length)return 0;
  let done=0;for(const h of habs){if(day?.checks?.[h.id])done++}
  return Math.round((done/habs.length)*100);
}
function getPeriodDates(ds,period){
  if(period==="week")return getWeekDates(ds);
  if(period==="month")return getMonthDates(ds);
  return getQuarterDates(ds);
}
function habitPeriodPct(data,hid,ds,period){
  const dates=getPeriodDates(ds,period);
  const hab=data.habits.find(h=>h.id===hid);if(!hab)return 0;
  // How many weeks in period
  const weeks=new Set();
  for(const d of dates)weeks.add(getWeekStart(d));
  const numWeeks=weeks.size;
  const target=hab.perWeek*numWeeks;if(!target)return 0;
  let done=0;for(const d of dates){if(data.days[d]?.checks?.[hid])done++}
  return Math.min(100,Math.round((done/target)*100));
}
function goalPeriodPct(data,gid,ds,period){
  const habs=data.habits.filter(h=>(h.goalIds||[]).includes(gid));
  if(!habs.length)return 0;
  let sum=0;for(const h of habs)sum+=habitPeriodPct(data,h.id,ds,period);
  return Math.round(sum/habs.length);
}
function getStreak(data){
  let streak=0,d=new Date(today()+"T00:00:00");
  const p=getDayPct(data,today());
  if(p===0)d.setDate(d.getDate()-1);
  while(true){const ds=fmt(d),n=dn(ds);if(n<1)break;
    if(getDayPct(data,ds)>0){streak++;d.setDate(d.getDate()-1)}else break}
  return streak;
}

    o+='<button onclick="set({sel:\''+ds+'\',tab:\'today\'})" style="background:'+bg+';border:1px solid '+(isSel?"#a78bfa":isToday?"#a78bfa44":"var(--border)")+';border-radius:5px;padding:'+(S.hf==="year"?"2px 0":"3px 0")+';font-size:'+(S.hf==="year"?7:S.hf==="quarter"?8:9)+'px;font-weight:'+(isSel||isToday?800:600)+';color:'+(isSel?"#fff":has?m.color:"var(--hidden)")+';text-align:center;min-height:'+(S.hf==="year"?"18px":"auto")+'">';
    if(S.hf==="year"){
      if(has)o+='<span style="font-size:6px">'+m.emoji+'</span>';

      o+=dd;
      if(has&&!isSel&&S.hf!=="quarter")o+='<div style="font-size:7px">'+m.emoji+'</div>';

  });
  o+='</div></div>';

  // Recent day list (filtered)
  const hRecent=hDates.filter(ds=>!!data.days[ds]).reverse().slice(0,8);
  if(hRecent.length){
    o+='<div style="margin-top:8px">';
    hRecent.forEach(ds=>{

      o+='<button onclick="set({sel:\''+ds+'\',tab:\'today\'})" style="display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:5px;text-align:left">';
      o+='<span style="font-size:20px">'+m.emoji+'</span>';
      o+='<div style="flex:1"><div style="font-size:12px;font-weight:600;color:var(--dim)">'+fmtD(ds)+'</div>';
      o+='<div style="font-size:10px;color:var(--faint)">Day '+dn(ds)+(data.days[ds].chilled?" \u2014 \u{1F9D8} Full day":"")+'</div></div>';
      o+='<div style="font-size:13px;font-weight:800;color:'+m.color+'">'+p+'%</div></button>';
    });
    o+='</div>';

  // Backup
  o+='<div class="sec-label">\u{1F4BE} Data</div>';
  o+='<div style="display:flex;gap:8px;margin-bottom:10px">';
  o+='<button onclick="exp(S.data)" style="flex:1;background:var(--btn-bg);border:1px solid var(--border2);color:var(--muted);border-radius:10px;padding:12px;font-size:12px;font-weight:600">\u{1F4BE} Export</button>';
  o+='<button onclick="imp(function(d){S.data=d;save(d);render()})" style="flex:1;background:var(--btn-bg);border:1px solid var(--border2);color:var(--muted);border-radius:10px;padding:12px;font-size:12px;font-weight:600">\u{1F4C2} Import</button></div>';
  o+='<button onclick="if(confirm(\'Reset all progress? Keeps goals and habits.\')){S.data.days={};save(S.data);render()}" style="width:100%;background:rgba(239,68,68,0.05);border:1px solid rgba(239,68,68,0.12);color:#ef4444;border-radius:10px;padding:12px;font-size:12px;font-weight:600">\u{1F5D1}\u{FE0F} Reset Progress</button>';
  o+='</div>';

  if(tab==="today"||tab==="season"){

  }

  // ===== URGE SHEET =====
  if(S.urge){

      o+='<div style="font-size:14px;color:var(--muted);margin-top:22px;line-height:1.6;font-weight:500">You can still do it in ten minutes.<br>For now, just don\u2019t.</div>';

      o+='<div style="font-size:26px;font-weight:800;color:var(--text);margin-bottom:28px">What happened?</div>';
      o+='<button onclick="resolveUrge(true)" style="width:100%;padding:19px;border-radius:100px;border:1.5px solid rgba(59,130,246,0.4);background:rgba(59,130,246,0.1);color:#3b82f6;font-size:16px;font-weight:800;letter-spacing:1px;margin-bottom:10px">\u{1F535}&nbsp; I resisted</button>';

    o+='</div></div>';
  }

  // Tab bar
  o+='<div class="tab-bar">';
  [{id:"today",i:"\u{2705}",l:"Today"},{id:"mantras",i:"\u{1F319}",l:"Mantras"},{id:"trophy",i:"\u{1F3C6}",l:"Goal"},{id:"dashboard",i:"\u{1F4CA}",l:"Stats"},{id:"settings",i:"\u{2699}\u{FE0F}",l:"Settings"}].forEach(t=>{
    o+='<button class="tab-btn'+(tab===t.id?" active":"")+'" onclick="set({tab:\''+t.id+'\'})">';
    o+='<span class="ti">'+t.i+'</span>'+t.l+'</button>';
  });
  o+='</div>';

  // ===== MODALS =====
  if(S.modal==="addGoal"||S.modal==="editGoal"){
    const isEdit=S.modal==="editGoal";
    o+='<div class="modal-overlay" onclick="if(event.target===this)set({modal:null})">';
    o+='<div class="modal">';
    o+='<div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:14px">'+(isEdit?"\u{270F}\u{FE0F} Edit Goal":"\u{1F3AF} Add Goal")+'</div>';
    o+='<div style="font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600">Emoji</div>';
    o+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">';
    EMOJIS.forEach(em=>{
      const sel=S.mf.emoji===em;
      o+='<button onclick="S.mf.emoji=\''+em+'\';render()" style="font-size:22px;padding:5px 7px;border-radius:8px;border:2px solid '+(sel?"#a78bfa":"rgba(255,255,255,0.06)")+';background:'+(sel?"rgba(167,139,250,0.1)":"rgba(255,255,255,0.02)")+'">'+em+'</button>';
    });
    o+='</div>';
    o+='<input id="mi" placeholder="Goal name" value="'+(S.mf.name||"").replace(/"/g,"&quot;")+'" oninput="S.mf.name=this.value">';
    o+='<div style="display:flex;gap:8px;margin-top:4px">';
    o+='<button onclick="set({modal:null})" style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--muted);border-radius:10px;padding:12px;font-size:14px;font-weight:600">Cancel</button>';
    o+='<button onclick="'+(isEdit?"editGoal()":"addGoal()")+'" style="flex:1;background:#a78bfa;border:none;color:#fff;border-radius:10px;padding:12px;font-size:14px;font-weight:700">'+(isEdit?"Save":"Add")+'</button></div></div></div>';
  }

  if(S.modal==="addHabit"||S.modal==="editHabit"){
    const isEdit=S.modal==="editHabit";
    o+='<div class="modal-overlay" onclick="if(event.target===this)set({modal:null})">';
    o+='<div class="modal">';
    o+='<div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:14px">'+(isEdit?"\u{270F}\u{FE0F} Edit Habit":"\u{2705} Add Habit")+'</div>';
    o+='<div style="font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600">Emoji</div>';
    o+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">';
    HABIT_EMOJIS.forEach(em=>{
      const sel=S.mf.emoji===em;
      o+='<button onclick="S.mf.emoji=\''+em+'\';render()" style="font-size:22px;padding:5px 7px;border-radius:8px;border:2px solid '+(sel?"#a78bfa":"rgba(255,255,255,0.06)")+';background:'+(sel?"rgba(167,139,250,0.1)":"rgba(255,255,255,0.02)")+'">'+em+'</button>';
    });
    o+='</div>';
    o+='<input id="mi" placeholder="Habit name" value="'+(S.mf.label||"").replace(/"/g,"&quot;")+'" oninput="S.mf.label=this.value">';
    o+='<div style="font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600">Goals (tap to toggle)</div>';
    o+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">';
    const selGoals=S.mf.goalIds||[];
    data.goals.forEach(g=>{
      const on=selGoals.includes(g.id);
      o+='<button onclick="var gi=S.mf.goalIds||[];if(gi.includes(\''+g.id+'\'))S.mf.goalIds=gi.filter(x=>x!==\''+g.id+'\');else{gi.push(\''+g.id+'\');S.mf.goalIds=gi};render()" style="padding:6px 12px;border-radius:10px;border:1px solid '+(on?"#a78bfa":"var(--border2)")+';background:'+(on?"rgba(167,139,250,0.1)":"var(--btn-bg)")+';color:'+(on?"#a78bfa":"var(--muted)")+';font-size:12px;font-weight:600">'+g.emoji+' '+g.name+'</button>';
    });
    o+='</div>';
    o+='<div style="font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600">Times per week</div>';
    o+='<div style="display:flex;gap:6px;margin-bottom:12px">';
    for(let i=1;i<=7;i++){
      const sel=parseInt(S.mf.perWeek)===i;
      o+='<button onclick="S.mf.perWeek='+i+';render()" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid '+(sel?"#a78bfa":"rgba(255,255,255,0.06)")+';background:'+(sel?"rgba(167,139,250,0.1)":"rgba(255,255,255,0.02)")+';color:'+(sel?"#a78bfa":"#666")+';font-size:14px;font-weight:700">'+i+'</button>';
    }
    o+='</div>';
    o+='<div style="font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600">Auto-checks another habit? (optional)</div>';
    o+='<select onchange="S.mf.linkedHabitId=this.value;render()">';
    o+='<option value=""'+((!S.mf.linkedHabitId)?" selected":"")+'>None</option>';
    data.habits.filter(h=>h.id!==S.mf.id).forEach(h=>{
      o+='<option value="'+h.id+'"'+(S.mf.linkedHabitId===h.id?" selected":"")+'>'+h.emoji+' '+h.label+'</option>';
    });
    o+='</select>';
    o+='<div style="display:flex;gap:8px;margin-top:4px">';
    o+='<button onclick="set({modal:null})" style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--muted);border-radius:10px;padding:12px;font-size:14px;font-weight:600">Cancel</button>';

    o+='<div class="modal">';
    o+='<div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:14px">'+(isEdit?"\u{270F}\u{FE0F} Edit Mantra":"\u{1F319} Add Mantra")+'</div>';
    o+='<input id="mi" placeholder="e.g. I am in control of my day" value="'+(S.mf.mantraText||"").replace(/"/g,"&quot;")+'" oninput="S.mf.mantraText=this.value" onkeydown="if(event.key===\'Enter\'){'+(isEdit?'editMantra()':'addMantra()')+'}">';
    o+='<div style="display:flex;gap:8px;margin-top:4px">';
    o+='<button onclick="set({modal:null})" style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--muted);border-radius:10px;padding:12px;font-size:14px;font-weight:600">Cancel</button>';
    o+='<button onclick="'+(isEdit?"editMantra()":"addMantra()")+'" style="flex:1;background:#a78bfa;border:none;color:#fff;border-radius:10px;padding:12px;font-size:14px;font-weight:700">'+(isEdit?"Save":"Add")+'</button></div></div></div>';
  }

  // Trophy caption modal
  if(S.modal==="trophyCaption"){
    o+='<div class="modal-overlay" onclick="if(event.target===this)set({modal:null})">';
    o+='<div class="modal">';
    o+='<div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:14px">\u{1F3C6} Add a caption</div>';
    if(S.mf.image)o+='<img src="'+S.mf.image+'" style="width:100%;border-radius:12px;margin-bottom:12px;aspect-ratio:1;object-fit:cover">';
    o+='<input id="mi" placeholder="Add a caption" value="'+(S.mf.caption||"")+'" oninput="S.mf.caption=this.value" onkeydown="if(event.key===\'Enter\')saveTrophy()">';

    o+='<button onclick="set({modal:null})" style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--muted);border-radius:10px;padding:12px;font-size:14px;font-weight:600">Cancel</button>';
    o+='<button onclick="saveTrophy()" style="flex:1;background:#f59e0b;border:none;color:#fff;border-radius:10px;padding:12px;font-size:14px;font-weight:700">Save</button></div></div></div>';
  }

  document.getElementById("app").innerHTML=o;
  const mi=document.getElementById("mi");if(mi)mi.focus();
  animateAlignment();
}

// Animate the alignment number + bar after each render
function animateAlignment(){
  const el=document.getElementById("pctnum");
  if(!el)return;
  const target=parseInt(el.textContent)||0;
  const from=(S.lastPct===undefined||S.lastPct===null)?target:S.lastPct;
  S.lastPct=target;
  if(from===target&&!S.justChecked)return;
  // Count up/down
  if(from!==target){
    const dur=Math.min(900,Math.max(320,Math.abs(target-from)*26));
    const t0=performance.now();
    const step=n=>{
      const p=Math.min(1,(n-t0)/dur);
      const e=1-Math.pow(1-p,3);
      el.textContent=Math.round(from+(target-from)*e);
      if(p<1)requestAnimationFrame(step);else el.textContent=target;
    };
    requestAnimationFrame(step);
  }
  if(S.justChecked){
    const dir=S.justChecked;S.justChecked=null;
    el.classList.add("pop");
    setTimeout(()=>el.classList.remove("pop"),600);
    const wrap=document.getElementById("pctwrap");
    const shell=document.getElementById("barshell");
    if(dir==="on"){
      if(wrap){
        const r=document.createElement("div");r.className="pct-ripple";wrap.appendChild(r);
        setTimeout(()=>r.remove(),950);
        const marks=target>=100?["\u{1F451}","\u2728","\u{1F451}"]:target>=75?["\u2728","\u2b50","\u2728"]:["\u2728"];
        marks.forEach((m,i)=>{
          const s=document.createElement("div");s.className="spark";s.textContent=m;
          s.style.left=(18+i*26+Math.random()*10)+"px";
          s.style.top="6px";s.style.animationDelay=(i*0.09)+"s";
          wrap.appendChild(s);setTimeout(()=>s.remove(),1300);
        });
      }
      if(shell){
        const sh=document.createElement("div");sh.className="bar-shine";shell.appendChild(sh);
        setTimeout(()=>sh.remove(),1600);
      }
      if(target>=100)celebrate();
    }
  }
}

function celebrate(){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:120;pointer-events:none;display:flex;align-items:center;justify-content:center";
  ov.innerHTML='<div style="text-align:center;animation:cineIn 0.6s ease both"><div style="font-size:64px">\u{1F451}</div><div style="font-size:19px;font-weight:800;color:#818cf8;letter-spacing:1px;margin-top:6px">Full clear</div></div>';
  document.body.appendChild(ov);
  setTimeout(()=>{ov.style.transition="opacity 0.7s";ov.style.opacity="0"},1500);
  setTimeout(()=>ov.remove(),2300);
}

applyTheme();
setInterval(applyTheme,3600000);
render();
</script>
